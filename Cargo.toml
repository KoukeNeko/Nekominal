[workspace]
resolver = "2"
members = [
    "crates/nekominal-pty",
    "crates/nekominal-model",
    "crates/nekominal-term",
    "crates/nekominal-input",
    "crates/nekominal-render",
    "crates/nekominal-ui",
    "crates/nekominal-shell",
    "tools/winprobe",
    "tools/agent-probe",
    "tools/d3d11-spike",
    "crates/nekominal-pane",
    "crates/nekominal-updater",
]

[workspace.package]
version = "0.2.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/KoukeNeko/Nekominal"
# windows-core/windows-bindgen 0.100 declare rust-version 1.95.
rust-version = "1.95"

[workspace.dependencies]
nekominal-pty = { path = "crates/nekominal-pty" }
nekominal-model = { path = "crates/nekominal-model" }
nekominal-term = { path = "crates/nekominal-term" }
nekominal-input = { path = "crates/nekominal-input" }
nekominal-render = { path = "crates/nekominal-render" }
nekominal-ui = { path = "crates/nekominal-ui" }
nekominal-pane = { path = "crates/nekominal-pane" }

# Terminal core (emulator + input encoding)
alacritty_terminal = { version = "=0.26.0", default-features = false }
base64 = "0.22.1"
memchr = "2.8"
# zlib for kitty graphics payloads (`o=z`); the version `png` already uses.
miniz_oxide = "0.8.9"
# The patterns of the triggers (`settings.json` `triggers`): one RegexSet over every line, captures for the actions.
regex = "1.13"
unicode-width = "=0.2.2"

# Renderer
swash = "=0.2.10"
harfrust = "=0.14.0"
etagere = "=0.3.0"
bytemuck = { version = "=1.25.2", features = ["derive"] }
png = "=0.18.1"
memmap2 = "=0.9.10"
rustc-hash = "=2.1.3"
unicode-segmentation = "=1.13.3"

# Win32 bindings.
windows = { version = "=0.62.2" }
windows-sys = "0.61"

# The accessibility tree of a window (UI Automation), built from the state of the shell.
accesskit = "=0.25.1"
accesskit_windows = "=0.35.1"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true

# Smaller debug builds.
[profile.dev]
debug = "line-tables-only"
