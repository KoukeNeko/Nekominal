[package]
name = "nekominal-updater"
description = "updater.exe: updates Nekominal with Scoop while the programs of its tabs keep running"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "updater"
path = "src/main.rs"

[dependencies]
nekominal-pty = { workspace = true }
serde_json = "1"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
# Compiles updater.rc (the icon of the app) into the program.
embed-resource = "=3.0.12"
