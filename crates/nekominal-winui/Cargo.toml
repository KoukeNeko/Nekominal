[package]
name = "nekominal-winui"
description = "WinUI 3 runtime helpers: bootstrap, Application subclass, wgpu SwapChainPanel surface, CoreText IME host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
nekominal-winui-sys = { workspace = true }
pollster = { workspace = true }
wgpu = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_System_Com",
] }
windows-collections = { version = "0.100", default-features = false, features = ["std"] }
windows-core = { version = "0.100", default-features = false }
windows-future = { version = "0.100", default-features = false }
windows-numerics = { version = "0.100", default-features = false }
windows-reference = { version = "0.100", default-features = false, features = ["std"] }
windows-threading = { version = "0.100", default-features = false }
windows-time = { version = "0.100", default-features = false }
