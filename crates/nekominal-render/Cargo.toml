[package]
name = "nekominal-render"
description = "Direct3D 11 terminal grid renderer: font stack, glyph atlas, procedural glyphs, overlays"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# Headless GPU context, offscreen target and PNG output for tests and tools. The product build does not
# need them (and does not pull in `png`).
offscreen = ["dep:png"]

[dependencies]
swash = { workspace = true }
harfrust = { workspace = true }
etagere = { workspace = true }
bytemuck = { workspace = true }
png = { workspace = true, optional = true }
memmap2 = { workspace = true }
rustc-hash = { workspace = true }
unicode-width = { workspace = true }

[build-dependencies]
# `build.rs` compiles the shaders with the system's D3DCompile, once, instead of the program at every start.
windows = { workspace = true, features = ["Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc"] }

[dev-dependencies]
# This crate's own tests and examples drive the renderer headlessly.
nekominal-render = { workspace = true, features = ["offscreen"] }
unicode-segmentation = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct2D_Common",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
# #[implement] expands to ::windows_core paths; this is the 0.62 generation that `windows` uses.
windows-core = "=0.62.2"
