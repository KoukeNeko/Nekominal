[package]
name = "nekominal-shell"
description = "Nekominal with a self-drawn shell: a Win32 window, DirectComposition, Direct3D 11 and nekominal-ui, no WinUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "nekominal-next"
path = "src/main.rs"

[dependencies]
nekominal-model = { workspace = true }
nekominal-pty = { workspace = true }
nekominal-term = { workspace = true }
nekominal-input = { workspace = true }
nekominal-render = { workspace = true }
nekominal-pane = { workspace = true }
nekominal-ui = { workspace = true }
serde_json = "1"
accesskit = { workspace = true }
accesskit_windows = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
nekominal-render = { workspace = true, features = ["offscreen"] }
