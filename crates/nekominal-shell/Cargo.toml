[package]
name = "nekominal-shell"
description = "Nekominal with a self-drawn shell: a Win32 window, DirectComposition, Direct3D 11 and nekominal-ui, no WinUI"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "nekominal-next"
path = "src/main.rs"

[dependencies]
nekominal-model = { workspace = true }
nekominal-pty = { workspace = true }
nekominal-term = { workspace = true }
nekominal-input = { workspace = true }
nekominal-render = { workspace = true }
nekominal-pane = { workspace = true }
nekominal-ui = { workspace = true }
serde_json = "1"
base64 = { workspace = true }
# A pasted image is saved as a PNG file, for the agents that take images by path.
png = { workspace = true }
accesskit = { workspace = true }
accesskit_windows = { workspace = true }
windows = { workspace = true, features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Globalization",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_Time",
    "Win32_System_SystemInformation",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# Compiles nekominal.rc (the icon of the app) into the program.
embed-resource = "=3.0.12"

[dev-dependencies]
nekominal-render = { workspace = true, features = ["offscreen"] }
