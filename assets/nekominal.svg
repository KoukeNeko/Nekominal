<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- C. Two layers: a frosted tile behind, and in front two cat eyes made of cursor blocks, glowing green. -->
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4170"/>
      <stop offset="1" stop-color="#191b30"/>
    </linearGradient>
    <radialGradient id="frost" cx=".3" cy=".2" r=".9">
      <stop offset="0" stop-color="#9fb6ff" stop-opacity=".35"/>
      <stop offset=".6" stop-color="#9fb6ff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#9fb6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4ff7a"/>
      <stop offset="1" stop-color="#7fd34e"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <!-- The tile behind, slightly to the back and up. -->
  <rect x="30" y="22" width="196" height="196" rx="48" fill="url(#back)"/>
  <rect x="30" y="22" width="196" height="196" rx="48" fill="url(#frost)"/>
  <!-- The glass in front, offset down: frosted edge, a light top rim. -->
  <rect x="20" y="40" width="216" height="196" rx="50" fill="#000" opacity=".35" filter="url(#soft)"/>
  <rect x="20" y="38" width="216" height="196" rx="50" fill="#232744" fill-opacity=".72"/>
  <rect x="20" y="38" width="216" height="196" rx="50" fill="url(#glass)"/>
  <rect x="21.5" y="39.5" width="213" height="193" rx="48.5" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="3"/>
  <!-- The eyes: cursor blocks with a slit. -->
  <g filter="url(#glow)">
    <rect x="62" y="104" width="46" height="70" rx="12" fill="url(#eye)"/>
    <rect x="148" y="104" width="46" height="70" rx="12" fill="url(#eye)"/>
  </g>
  <rect x="81" y="114" width="8" height="50" rx="4" fill="#16200f"/>
  <rect x="167" y="114" width="8" height="50" rx="4" fill="#16200f"/>
</svg>
